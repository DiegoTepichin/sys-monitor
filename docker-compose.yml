services:
  sys-monitor:
    build: .
    ports:
      - '5002:5002'
    volumes:
      - ./logs:/app/logs
    environment:
      PORT: 5002
      # Optional: only needed if agents will POST metrics to this server
      API_KEY: ${API_KEY:-}
      POLL_INTERVAL: 5
      HISTORY_LIMIT: 20
    restart: unless-stopped
